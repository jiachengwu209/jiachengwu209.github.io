# Academic profile
position: "PhD Researcher in Chemical Engineering"

research_summary: >
  My research focuses on practical high-mass-loading carbon electrodes
  for electrochemical energy storage, particularly aqueous zinc-ion
  hybrid capacitors and sodium-ion batteries. My work investigates
  electronic and ionic transport, porous carbon materials, electrode
  architecture, carbon nanofibers, and practical energy-storage devices.

